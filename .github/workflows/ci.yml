# Runs on every push to main and every pull request. A failure in any job
# blocks the change. Every job works without secrets.
#
# More jobs arrive with the features they check (see docs/spec/deployment.md):
# end-to-end with axe, eval replay.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Fails if anything that looks like a secret reached the browser bundle.
      - run: pnpm check:secrets

  a11y:
    name: Accessibility (axe on every story)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slip/a11y exec playwright install chromium
      - run: pnpm build:storybook
      # Fails on any serious or critical axe violation in any story.
      - run: pnpm a11y

  visual:
    name: Screenshots of every story
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The official Playwright image, so fonts and anti-aliasing match `pnpm visual` locally.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:storybook
      # A story with no baseline gets one written; any difference from a committed one fails.
      - run: pnpm --filter @slip/visual exec playwright test --update-snapshots=missing
      - name: Fail if a baseline had to be written
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          written=$(git status --porcelain --untracked-files=all tools/visual/baselines | wc -l)
          if [ "$written" -gt 0 ]; then
            echo "::error::$written baselines were missing and have been written. Download the visual-baselines artifact, check the images and commit them."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: tools/visual/baselines
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-differences
          path: tools/visual/test-results
          retention-days: 7

  perf:
    name: Performance budgets (100K subset)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slip/perf exec playwright install chromium
      # Builds the app, serves it with vite preview, and checks the 100K budgets
      # at twice the local thresholds. Shared runners are too noisy for more (D14).
      - run: pnpm perf:ci
